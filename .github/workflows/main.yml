name: Build Mainline Kernel for Xiaomi Joyeuse (Huaxing)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: sm7125-mainline/linux
          ref: lineage-22.2
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential bc flex bison \
            libssl-dev libelf-dev device-tree-compiler \
            gcc-aarch64-linux-gnu cpio python3-pip
          pip3 install mkbootimg

      - name: Configure kernel (sm7125.config)
        working-directory: kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- sm7125.config
          # Ensure UAC2 gadget is enabled
          scripts/config --enable CONFIG_USB_CONFIGFS_F_UAC2
          scripts/config --enable CONFIG_USB_GADGET
          scripts/config --enable CONFIG_USB_CONFIGFS

      - name: Build kernel and dtbs
        working-directory: kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs
          mkdir -p ../output

      - name: Combine kernel with joyeuse device tree
        run: |
          # Find the correct DTB for joyeuse (Huaxing panel)
          DTB=$(find kernel/arch/arm64/boot/dts/qcom -name "*joyeuse*.dtb" | head -1)
          if [ -z "$DTB" ]; then
            echo "No joyeuse DTB found, using miatoll generic"
            DTB=$(find kernel/arch/arm64/boot/dts/qcom -name "*miatoll*.dtb" | head -1)
          fi
          echo "Using DTB: $DTB"
          # Combine kernel and DTB
          cat kernel/arch/arm64/boot/Image $DTB > Image-dtb
          # Create minimal initramfs (just a shell)
          mkdir -p initramfs
          cd initramfs
          cat > init << 'EOF'
          #!/bin/sh
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          echo "Mainline kernel with Huaxing panel booted successfully"
          exec /bin/sh
          EOF
          chmod +x init
          find . | cpio -o -H newc | gzip > ../initrd.gz
          cd ..
          # Create boot.img using mkbootimg (offsets from typical ARM64)
          mkbootimg --kernel Image-dtb \
                    --ramdisk initrd.gz \
                    --base 0x00000000 \
                    --pagesize 4096 \
                    --kernel_offset 0x00008000 \
                    --ramdisk_offset 0x01000000 \
                    --tags_offset 0x00000100 \
                    --cmdline "console=tty0 quiet" \
                    -o boot.img
          cp boot.img output/

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: joyeuse-mainline-boot
          path: output/boot.img
